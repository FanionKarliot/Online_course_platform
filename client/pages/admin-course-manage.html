<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gérer un cours</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-3xl mx-auto px-6 py-8">
    <a href="/pages/admin-courses.html" class="text-sm text-indigo-600 hover:underline mb-4 inline-block">
      <i class="fa-solid fa-arrow-left"></i> Retour aux cours
    </a>

    <div id="chargement" class="flex justify-center py-20"><div class="spinner"></div></div>

    <div id="contenu" class="hidden">
      <h1 id="titre-cours" class="text-2xl font-bold text-gray-800 mb-8"></h1>

      <!-- ===== CHAPITRES ===== -->
      <section class="bg-white rounded-xl shadow-sm p-6 mb-6">
        <h2 class="text-lg font-bold text-gray-800 mb-4"><i class="fa-solid fa-list"></i> Chapitres</h2>
        <div id="liste-chapitres" class="space-y-2 mb-4"></div>

        <button id="btn-ajouter-chapitre" type="button" class="text-sm text-indigo-600 hover:underline">
          <i class="fa-solid fa-plus"></i> Ajouter un chapitre
        </button>

        <form id="form-chapitre" class="hidden mt-4 space-y-3 border-t border-gray-100 pt-4">
          <input type="hidden" id="chapitre-id" />
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Titre</label>
            <input type="text" id="chapitre-titre" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Ordre</label>
              <input type="number" id="chapitre-ordre" min="1" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">URL vidéo (optionnel)</label>
              <input type="url" id="chapitre-video" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contenu (texte, optionnel)</label>
            <textarea id="chapitre-contenu" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
          </div>
          <div class="flex gap-2">
            <button type="submit" class="flex-1 bg-indigo-600 text-white rounded-lg py-2 text-sm hover:bg-indigo-700">Enregistrer le chapitre</button>
            <button type="button" id="btn-annuler-chapitre" class="flex-1 bg-gray-100 text-gray-700 rounded-lg py-2 text-sm hover:bg-gray-200">Annuler</button>
          </div>
        </form>
      </section>

      <!-- ===== QUIZ ===== -->
      <section class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="text-lg font-bold text-gray-800 mb-4"><i class="fa-solid fa-circle-question"></i> Quiz</h2>
        <div id="liste-quiz" class="space-y-2 mb-4"></div>

        <button id="btn-ajouter-quiz" type="button" class="text-sm text-indigo-600 hover:underline">
          <i class="fa-solid fa-plus"></i> Ajouter un quiz
        </button>

        <form id="form-quiz" class="hidden mt-4 space-y-4 border-t border-gray-100 pt-4">
          <input type="hidden" id="quiz-id" />
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Titre du quiz</label>
            <input type="text" id="quiz-titre" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Note minimale pour réussir (%)</label>
            <input type="number" id="quiz-note-min" min="0" max="100" value="50" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>

          <div id="liste-questions" class="space-y-4"></div>

          <button type="button" id="btn-ajouter-question" class="text-sm text-indigo-600 hover:underline">
            <i class="fa-solid fa-plus"></i> Ajouter une question
          </button>

          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-indigo-600 text-white rounded-lg py-2 text-sm hover:bg-indigo-700">Enregistrer le quiz</button>
            <button type="button" id="btn-annuler-quiz" class="flex-1 bg-gray-100 text-gray-700 rounded-lg py-2 text-sm hover:bg-gray-200">Annuler</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/admin-course-manage.js"></script>
  <script>
    exigerAdmin();
    afficherNavbar();
  </script>
</body>
</html>
