<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — CoursEnLigne</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .anim-fade-up { animation: fadeInUp 0.5s ease-out both; }
      .anim-delay-1 { animation-delay: 0.08s; }
      .anim-delay-2 { animation-delay: 0.16s; }
      .anim-delay-3 { animation-delay: 0.24s; }

      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
        opacity: 0.35;
        pointer-events: none;
      }

      /* Carte question */
      .carte-question {
        background: #fff;
        border: 1px solid #f1f5f9;
        border-radius: 1rem;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }
      .carte-question:hover {
        border-color: #e2e8f0;
      }

      /* Option de réponse */
      .option-reponse {
        display: flex;
        align-items: flex-start;
        gap: 0.875rem;
        padding: 0.875rem 1rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.875rem;
        cursor: pointer;
        transition: all 0.2s ease;
        background: #fff;
      }
      .option-reponse:hover {
        border-color: #c7d2fe;
        background: #f8faff;
      }
      .option-reponse input[type="radio"] {
        margin-top: 2px;
        width: 1.05rem;
        height: 1.05rem;
        accent-color: #4f46e5;
        cursor: pointer;
        flex-shrink: 0;
      }
      .option-reponse:has(input:checked) {
        border-color: #6366f1;
        background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 100%);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
      }
      .option-reponse:has(input:checked) .lettre-option {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: #fff;
        border-color: transparent;
      }

      .lettre-option {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #6b7280;
        font-size: 0.75rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50 overflow-x-hidden">
    <div id="navbar"></div>

    <!-- ============================================================= -->
    <!-- EN-TÊTE DÉGRADÉ                                               -->
    <!-- ============================================================= -->
    <section class="relative overflow-hidden bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-700 text-white">
      <div class="blob w-80 h-80 bg-violet-400 -top-20 -left-20"></div>
      <div class="blob w-72 h-72 bg-indigo-300 top-1/2 -right-16"></div>
      <div class="absolute inset-0 opacity-[0.07]"
           style="background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 40px 40px;"></div>

      <div class="relative max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
        <nav class="anim-fade-up flex items-center gap-2 text-xs text-indigo-100/80 mb-5">
          <a href="/index.html" class="hover:text-white transition-colors">Accueil</a>
          <i class="fa-solid fa-chevron-right text-[8px]"></i>
          <a href="/pages/courses.html" class="hover:text-white transition-colors">Catalogue</a>
          <i class="fa-solid fa-chevron-right text-[8px]"></i>
          <span class="text-white font-medium">Quiz</span>
        </nav>

        <button
          type="button"
          onclick="history.back(); return false;"
          class="anim-fade-up inline-flex items-center gap-2 text-sm text-indigo-100/90 hover:text-white
                 bg-white/10 backdrop-blur-sm border border-white/15
                 px-3.5 py-2 rounded-xl transition-all duration-200"
        >
          <i class="fa-solid fa-arrow-left text-xs"></i>
          <span>Retour</span>
        </button>
      </div>

      <div class="absolute bottom-0 left-0 right-0 leading-none">
        <svg viewBox="0 0 1440 40" preserveAspectRatio="none" class="w-full h-8 block">
          <path fill="#f9fafb" d="M0,20 C240,40 480,0 720,15 C960,30 1200,35 1440,20 L1440,40 L0,40 Z"></path>
        </svg>
      </div>
    </section>

    <!-- ============================================================= -->
    <!-- CONTENU                                                       -->
    <!-- ============================================================= -->
    <main class="max-w-2xl mx-auto px-4 sm:px-6 py-8 pb-24 md:pb-12 -mt-6 relative z-10">

      <!-- Chargement -->
      <div id="chargement" class="flex flex-col items-center justify-center py-20 gap-4">
        <div class="w-14 h-14 rounded-2xl bg-white shadow-md flex items-center justify-center">
          <div class="spinner"></div>
        </div>
        <p class="text-sm text-gray-500">Chargement du quiz…</p>
      </div>

      <!-- ============ FORMULAIRE DU QUIZ ============ -->
      <div id="bloc-quiz" class="hidden space-y-6">

        <!-- Carte titre + info -->
        <div class="anim-fade-up bg-white border border-gray-100 rounded-2xl p-6 sm:p-7 shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <span class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400 to-amber-500
                         flex items-center justify-center text-white shadow-md shadow-amber-500/25">
              <i class="fa-solid fa-circle-question"></i>
            </span>
            <span class="text-[11px] font-semibold tracking-widest uppercase text-amber-600">
              Quiz interactif
            </span>
          </div>

          <h1 id="quiz-titre" class="text-xl sm:text-2xl lg:text-3xl font-bold text-gray-900 tracking-tight mb-2 leading-tight"></h1>
          <p id="quiz-info" class="text-sm text-gray-500"></p>
        </div>

        <!-- Questions (injectées par quiz.js) -->
        <form id="form-quiz" class="space-y-5"></form>

        <!-- Bouton soumettre -->
        <button
          id="btn-soumettre"
          form="form-quiz"
          type="submit"
          class="anim-fade-up anim-delay-3 w-full py-3.5 rounded-xl font-medium text-white
                 bg-gradient-to-r from-indigo-600 to-violet-600
                 hover:from-indigo-700 hover:to-violet-700
                 shadow-lg shadow-indigo-500/25 hover:shadow-xl hover:shadow-indigo-500/30
                 transition-all duration-200
                 inline-flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-paper-plane"></i>
          <span>Soumettre mes réponses</span>
        </button>
      </div>

      <!-- ============ RÉSULTAT ============ -->
      <div id="bloc-resultat" class="hidden space-y-5">

        <!-- Carte résultat (injectée par quiz.js) -->
        <div id="carte-resultat" class="anim-fade-up"></div>

        <!-- Correction -->
        <div id="liste-correction" class="space-y-3"></div>

        <!-- Retour au cours -->
        <a
          id="retour-cours"
          href="#"
          class="anim-fade-up anim-delay-3 block text-center
                 inline-flex items-center justify-center gap-2 w-full
                 px-4 py-3 rounded-xl text-indigo-600 font-medium
                 bg-indigo-50 hover:bg-indigo-100
                 transition-colors duration-200"
        >
          <i class="fa-solid fa-arrow-left text-xs"></i>
          <span>Retour au cours</span>
        </a>
      </div>

    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/quiz.js"></script>
    <script>
      exigerConnexion();
      afficherNavbar();
    </script>
  </body>
</html>
