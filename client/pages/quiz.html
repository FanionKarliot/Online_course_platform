<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="min-h-screen">
    <div id="navbar"></div>

    <main class="max-w-2xl mx-auto px-6 py-8">
      <div id="chargement" class="flex justify-center py-20">
        <div class="spinner"></div>
      </div>

      <!-- Formulaire du quiz -->
      <div id="bloc-quiz" class="hidden">
        <h1 id="quiz-titre" class="text-2xl font-bold text-gray-800 mb-2"></h1>
        <p id="quiz-info" class="text-sm text-gray-500 mb-6"></p>

        <form id="form-quiz" class="space-y-6"></form>

        <button
          id="btn-soumettre"
          form="form-quiz"
          type="submit"
          class="w-full mt-6 bg-indigo-600 text-white rounded-lg py-3 font-medium hover:bg-indigo-700 transition"
        >
          <i class="fa-solid fa-paper-plane"></i> Soumettre mes réponses
        </button>
      </div>

      <!-- Résultat affiché après soumission -->
      <div id="bloc-resultat" class="hidden">
        <div id="carte-resultat" class="rounded-xl p-6 text-center mb-6"></div>
        <div id="liste-correction" class="space-y-3"></div>
        <a
          id="retour-cours"
          href="#"
          class="block text-center mt-6 text-indigo-600 hover:underline"
        >
          <i class="fa-solid fa-arrow-left"></i> Retour au cours
        </a>
      </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/quiz.js"></script>
    <script>
      exigerConnexion();
      afficherNavbar();
    </script>
  </body>
</html>
