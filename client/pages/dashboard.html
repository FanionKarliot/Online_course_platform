<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="min-h-screen">
    <div id="navbar"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <h1
        class="text-xl sm:text-2xl lg:text-3xl font-bold text-gray-800 mb-6 flex items-center gap-2"
      >
        <i class="fa-solid fa-gauge text-indigo-600"></i>
        <span>Mon tableau de bord</span>
      </h1>

      <!-- Statistiques rapides -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-3 sm:p-4 text-center">
          <p
            id="stat-inscrits"
            class="text-xl sm:text-2xl font-bold text-indigo-600"
          >
            0
          </p>
          <p class="text-xs text-gray-500 leading-tight">Cours suivis</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-3 sm:p-4 text-center">
          <p
            id="stat-termines"
            class="text-xl sm:text-2xl font-bold text-green-600"
          >
            0
          </p>
          <p class="text-xs text-gray-500 leading-tight">Cours terminés</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-3 sm:p-4 text-center">
          <p
            id="stat-quiz"
            class="text-xl sm:text-2xl font-bold text-amber-600"
          >
            0
          </p>
          <p class="text-xs text-gray-500 leading-tight">Quiz passés</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-3 sm:p-4 text-center">
          <p
            id="stat-moyenne"
            class="text-xl sm:text-2xl font-bold text-purple-600"
          >
            0%
          </p>
          <p class="text-xs text-gray-500 leading-tight">Moyenne quiz</p>
        </div>
      </div>

      <!-- Onglets -->
      <div
        class="flex justify-center gap-8 sm:gap-12 mb-6 border-b border-gray-200 overflow-x-auto"
      >
        <button
          data-onglet="cours"
          class="onglet-btn whitespace-nowrap px-4 sm:px-6 py-3 text-lg sm:text-base font-medium text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2"
        >
          <i class="fa-solid fa-book"></i>
          <span class="hidden sm:inline">Mes cours</span>
        </button>
        <button
          data-onglet="resultats"
          class="onglet-btn whitespace-nowrap px-4 sm:px-6 py-3 text-lg sm:text-base font-medium text-gray-500 flex items-center gap-2"
        >
          <i class="fa-solid fa-chart-simple"></i>
          <span class="hidden sm:inline">Résultats de quiz</span>
        </button>
        <button
          data-onglet="notifications"
          class="onglet-btn whitespace-nowrap px-4 sm:px-6 py-3 text-lg sm:text-base font-medium text-gray-500 flex items-center gap-2"
        >
          <i class="fa-solid fa-bell"></i>
          <span class="hidden sm:inline">Notifications</span>
        </button>
      </div>

      <div id="onglet-cours" class="onglet-contenu space-y-3"></div>
      <div id="onglet-resultats" class="onglet-contenu space-y-3 hidden"></div>
      <div
        id="onglet-notifications"
        class="onglet-contenu space-y-3 hidden"
      ></div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/dashboard.js"></script>
    <script>
      exigerConnexion();
      afficherNavbar();
    </script>
  </body>
</html>
