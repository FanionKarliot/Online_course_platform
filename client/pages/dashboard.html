<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="min-h-screen">
    <div id="navbar"></div>

    <main class="max-w-5xl mx-auto px-6 py-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">
        <i class="fa-solid fa-gauge text-indigo-600"></i> Mon tableau de bord
      </h1>

      <!-- Statistiques rapides -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-4 text-center">
          <p id="stat-inscrits" class="text-2xl font-bold text-indigo-600">0</p>
          <p class="text-xs text-gray-500">Cours suivis</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 text-center">
          <p id="stat-termines" class="text-2xl font-bold text-green-600">0</p>
          <p class="text-xs text-gray-500">Cours terminés</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 text-center">
          <p id="stat-quiz" class="text-2xl font-bold text-amber-600">0</p>
          <p class="text-xs text-gray-500">Quiz passés</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 text-center">
          <p id="stat-moyenne" class="text-2xl font-bold text-purple-600">0%</p>
          <p class="text-xs text-gray-500">Moyenne quiz</p>
        </div>
      </div>

      <!-- Onglets -->
      <div class="flex gap-2 mb-6 border-b border-gray-200">
        <button
          data-onglet="cours"
          class="onglet-btn px-4 py-2 font-medium text-indigo-600 border-b-2 border-indigo-600"
        >
          <i class="fa-solid fa-book"></i> Mes cours
        </button>
        <button
          data-onglet="resultats"
          class="onglet-btn px-4 py-2 font-medium text-gray-500"
        >
          <i class="fa-solid fa-chart-simple"></i> Résultats de quiz
        </button>
        <button
          data-onglet="notifications"
          class="onglet-btn px-4 py-2 font-medium text-gray-500"
        >
          <i class="fa-solid fa-bell"></i> Notifications
        </button>
      </div>

      <div id="onglet-cours" class="onglet-contenu space-y-3"></div>
      <div id="onglet-resultats" class="onglet-contenu space-y-3 hidden"></div>
      <div
        id="onglet-notifications"
        class="onglet-contenu space-y-3 hidden"
      ></div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/dashboard.js"></script>
    <script>
      exigerConnexion();
      afficherNavbar();
    </script>
  </body>
</html>
