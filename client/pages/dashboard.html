<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord — CoursEnLigne</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .anim-fade-up { animation: fadeInUp 0.5s ease-out both; }
      .anim-delay-1 { animation-delay: 0.06s; }
      .anim-delay-2 { animation-delay: 0.12s; }
      .anim-delay-3 { animation-delay: 0.18s; }
      .anim-delay-4 { animation-delay: 0.24s; }

      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
        opacity: 0.35;
        pointer-events: none;
      }

      /* Cartes de stats : hover léger */
      .carte-stat {
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      }
      .carte-stat:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px -10px rgba(79, 70, 229, 0.15);
      }

      /* Scroll discret pour la barre d'onglets */
      .onglets-scroll::-webkit-scrollbar { height: 4px; }
      .onglets-scroll::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50 overflow-x-hidden">
    <div id="navbar"></div>

    <!-- ============================================================= -->
    <!-- EN-TÊTE DÉGRADÉ                                               -->
    <!-- ============================================================= -->
    <section class="relative overflow-hidden bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-700 text-white">
      <div class="blob w-80 h-80 bg-violet-400 -top-20 -left-20"></div>
      <div class="blob w-72 h-72 bg-indigo-300 top-1/2 -right-16"></div>
      <div class="absolute inset-0 opacity-[0.07]"
           style="background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 40px 40px;"></div>

      <div class="relative max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-12">
        <nav class="anim-fade-up flex items-center gap-2 text-xs text-indigo-100/80 mb-4">
          <a href="/index.html" class="hover:text-white transition-colors">Accueil</a>
          <i class="fa-solid fa-chevron-right text-[8px]"></i>
          <span class="text-white font-medium">Tableau de bord</span>
        </nav>

        <div class="anim-fade-up anim-delay-1 flex items-start sm:items-center gap-4">
          <span class="w-14 h-14 rounded-2xl bg-white/15 backdrop-blur-sm border border-white/20
                       flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-gauge text-xl"></i>
          </span>
          <div>
            <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight">
              Mon tableau de bord
            </h1>
            <p class="text-sm sm:text-base text-indigo-100/90 mt-1">
              Suivez votre progression et consultez vos résultats en un coup d'œil.
            </p>
          </div>
        </div>
      </div>

      <div class="absolute bottom-0 left-0 right-0 leading-none">
        <svg viewBox="0 0 1440 40" preserveAspectRatio="none" class="w-full h-8 block">
          <path fill="#f9fafb" d="M0,20 C240,40 480,0 720,15 C960,30 1200,35 1440,20 L1440,40 L0,40 Z"></path>
        </svg>
      </div>
    </section>

    <!-- ============================================================= -->
    <!-- CONTENU                                                       -->
    <!-- ============================================================= -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24 md:pb-12 -mt-6 relative z-10">

      <!-- ============ STATISTIQUES ============ -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8">

        <!-- Cours suivis -->
        <div class="carte-stat anim-fade-up bg-white border border-gray-100 rounded-2xl p-4 sm:p-5 shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <span class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600
                         flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-book text-sm"></i>
            </span>
            <span class="text-[10px] font-semibold tracking-widest uppercase text-gray-400">
              Cours suivis
            </span>
          </div>
          <p id="stat-inscrits" class="text-2xl sm:text-3xl font-bold text-gray-900 leading-none">0</p>
        </div>

        <!-- Cours terminés -->
        <div class="carte-stat anim-fade-up anim-delay-1 bg-white border border-gray-100 rounded-2xl p-4 sm:p-5 shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <span class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600
                         flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-circle-check text-sm"></i>
            </span>
            <span class="text-[10px] font-semibold tracking-widest uppercase text-gray-400">
              Terminés
            </span>
          </div>
          <p id="stat-termines" class="text-2xl sm:text-3xl font-bold text-gray-900 leading-none">0</p>
        </div>

        <!-- Quiz passés -->
        <div class="carte-stat anim-fade-up anim-delay-2 bg-white border border-gray-100 rounded-2xl p-4 sm:p-5 shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <span class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600
                         flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-circle-question text-sm"></i>
            </span>
            <span class="text-[10px] font-semibold tracking-widest uppercase text-gray-400">
              Quiz passés
            </span>
          </div>
          <p id="stat-quiz" class="text-2xl sm:text-3xl font-bold text-gray-900 leading-none">0</p>
        </div>

        <!-- Moyenne quiz -->
        <div class="carte-stat anim-fade-up anim-delay-3 bg-white border border-gray-100 rounded-2xl p-4 sm:p-5 shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <span class="w-10 h-10 rounded-xl bg-violet-50 text-violet-600
                         flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-chart-line text-sm"></i>
            </span>
            <span class="text-[10px] font-semibold tracking-widest uppercase text-gray-400">
              Moyenne
            </span>
          </div>
          <p id="stat-moyenne" class="text-2xl sm:text-3xl font-bold text-gray-900 leading-none">0%</p>
        </div>
      </div>

      <!-- ============ ONGLETS ============ -->
<div class="anim-fade-up anim-delay-2 bg-white border border-gray-100 rounded-t-2xl px-2 sm:px-4 pt-2
            border-b border-gray-200">
  <div class="flex justify-center gap-2 sm:gap-6 overflow-x-auto onglets-scroll">

    <button
      data-onglet="cours"
      class="onglet-btn whitespace-nowrap px-4 sm:px-5 py-3 text-sm sm:text-base font-medium
             text-indigo-600 border-b-2 border-indigo-600
             flex items-center gap-2 transition-colors duration-200"
    >
      <i class="fa-solid fa-book"></i>
      <span class="hidden sm:inline">Mes cours</span>
    </button>

    <button
      data-onglet="resultats"
      class="onglet-btn whitespace-nowrap px-4 sm:px-5 py-3 text-sm sm:text-base font-medium
             text-gray-500 hover:text-indigo-600 border-b-2 border-transparent
             flex items-center gap-2 transition-colors duration-200"
    >
      <i class="fa-solid fa-chart-simple"></i>
      <span class="hidden sm:inline">Résultats de quiz</span>
    </button>

    <button
      data-onglet="notifications"
      class="onglet-btn whitespace-nowrap px-4 sm:px-5 py-3 text-sm sm:text-base font-medium
             text-gray-500 hover:text-indigo-600 border-b-2 border-transparent
             flex items-center gap-2 transition-colors duration-200"
    >
      <i class="fa-solid fa-bell"></i>
      <span class="hidden sm:inline">Notifications</span>
    </button>
  </div>
</div>

      <!-- ============ CONTENU DES ONGLETS ============ -->
      <div class="bg-white border border-gray-100 border-t-0 rounded-b-2xl p-4 sm:p-6 shadow-sm">

        <div id="onglet-cours" class="onglet-contenu space-y-3"></div>
        <div id="onglet-resultats" class="onglet-contenu space-y-3 hidden"></div>
        <div id="onglet-notifications" class="onglet-contenu space-y-3 hidden"></div>

      </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/dashboard.js"></script>
    <script>
      exigerConnexion();
      afficherNavbar();
    </script>
  </body>
</html>
