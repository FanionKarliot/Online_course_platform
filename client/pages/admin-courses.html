<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Cours</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-4xl mx-auto px-6 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">
        <i class="fa-solid fa-user-shield text-indigo-600"></i> Administration des cours
      </h1>
      <button id="btn-nouveau-cours" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
        <i class="fa-solid fa-plus"></i> Nouveau cours
      </button>
    </div>

    <div id="liste-cours-admin" class="space-y-3"></div>
  </main>

  <!-- Modale : créer/modifier les infos générales d'un cours -->
  <div id="modale-cours" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h2 id="modale-titre" class="text-lg font-bold text-gray-800 mb-4">Nouveau cours</h2>
      <form id="form-cours" class="space-y-3">
        <input type="hidden" id="cours-id" />
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Titre</label>
          <input type="text" id="input-titre" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea id="input-description" required rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie</label>
            <input type="text" id="input-categorie" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Niveau</label>
            <select id="input-niveau" class="w-full border border-gray-300 rounded-lg px-3 py-2">
              <option value="debutant">Débutant</option>
              <option value="intermediaire">Intermédiaire</option>
              <option value="avance">Avancé</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Enseignant</label>
          <input type="text" id="input-enseignant" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 bg-indigo-600 text-white rounded-lg py-2 hover:bg-indigo-700">Enregistrer</button>
          <button type="button" id="btn-annuler" class="flex-1 bg-gray-100 text-gray-700 rounded-lg py-2 hover:bg-gray-200">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/admin-courses.js"></script>
  <script>
    exigerAdmin();
    afficherNavbar();
  </script>
</body>
</html>
