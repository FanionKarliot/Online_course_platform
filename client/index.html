<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoursEnLigne — Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="min-h-screen">
    <div id="navbar"></div>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-800 mb-6">
        Catalogue des cours
      </h1>

      <!-- Barre de filtres -->
      <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mb-6">
        <input
          id="recherche"
          type="text"
          placeholder="Rechercher un cours..."
          class="w-full sm:flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <select
          id="filtre-categorie"
          class="w-full sm:w-auto border border-gray-300 rounded-lg px-4 py-2"
        >
          <option value="">Toutes catégories</option>
        </select>
        <select
          id="filtre-niveau"
          class="w-full sm:w-auto border border-gray-300 rounded-lg px-4 py-2"
        >
          <option value="">Tous niveaux</option>
          <option value="debutant">Débutant</option>
          <option value="intermediaire">Intermédiaire</option>
          <option value="avance">Avancé</option>
        </select>
      </div>

      <!-- Grille de cours -->
      <div
        id="liste-cours"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"
      >
        <!-- Les cartes de cours seront injectées ici par home.js -->
      </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/home.js"></script>
    <script>
      afficherNavbar();
    </script>
  </body>
</html>
